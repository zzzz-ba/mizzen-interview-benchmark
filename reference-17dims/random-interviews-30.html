4b-e657-42d0-82d8-701b8ce22e7a"}]}}],"executionMode":"hard"}},{"id":"6253977b-7d9a-447c-ae2e-208f57fb24c8","text":"是否接触过中粮的餐饮调味品？ 对中粮的餐饮调味品评价如何？","followUp":"none","itemType":"question","readableId":"Q37","questionType":"open_ended"}],"readableId":"S8","description":"按原稿任务顺序使用开放访谈题。先听自发回答；仅补本题漏答或澄清。是否与适用细节在同题内承接；后题按前置开放回答的语义条件显示。未知、拒答、未提及不强行归类。保留原模块参考预算。","sectionType":"flat","sectionTitle":"S8 收尾总结&补充提问（1分钟）","sectionInstruction":""}],"7ba76caadf2bf91c43be1181a8e0e8b3":[{"id":"195314b6-d799-4b93-be0a-adc3bccc613c","items":[{"id":"73624de1-c316-4343-8ed5-b43e96f6bf20","text":"首先，请您完全放松、自由地告诉我，对于这个产品的颜色/色号，您第一印象或者最直接的想法是什么？不用考虑对错，想到什么就说什么","followUp":"none","itemType":"question","readableId":"Q1","questionType":"open_ended","addInstructions":"不打断，不立刻追问具体属性。  \n若消费者回答较短（如「还行」「挚好看的」），可自然追问：  \n「能再多说一点吗？这个颜色让您联想到什么？」  \n「您第一眼看到它时，心里是什么感觉？」"}],"metadata":{"clientRef":"section-s1"},"readableId":"S1","description":"Part 1: 第一印象（建议 0:00 ~ 0:30）","sectionType":"flat","sectionTitle":"S1. 第一印象","sectionInstruction":"记录受访者提到的所有关键词，作为后续追问的基础。\n\nAI访谈执行规则（全程适用）：\n\n1.  用自己的话自然发问，禁止逐字念读预设话术\n    \n2.  可合并2个以上追问方向为一个自然问题\n    \n3.  多属性命中时，按受访者提及的先后顺序追问\n    \n4.  追问时优先引用受访者原话，不用预设关键词术语，不用专业术语（禁止使用「明度」「色调」「光泽感」等词）\n    \n5.  每个属性最多追问3轮，表达简洁时深挖，主动展开时收住\n    \n6.  保持中立，不预设立场，先完整倾听再追问\n    \n7.  全程聚焦产品本身的颜色表现和使用感受，不要引导受访者往特定方向思考\n    \n8.  全程禁止打分/评分类提问\n    \n9.  全程禁止追问购买意愿、购买意图、推荐意愿等消费决策相关问题\n    \n10.  不要问消费者觉得颜色应该怎么调/怎么改\n     \n11.  若受访者回答明显无关当前问题，AI必须主动表示「没听清楚」或「想了解更具体的内容」，引导受访者重新作答，绝不允许直接跳过"},{"id":"80309b32-21c3-414b-9cf2-55af21d10421","items":[{"id":"cdaf70bb-82ab-4fae-95dd-68452be6ecc5","text":"好的，刚才您说了对它的第一印象。除了您刚才提到的那些，您还喜欢这个颜色的哪些方面？ 能具体说说您的感受吗？","followUp":"timed","itemType":"question","metadata":{"clientRef":"stream-item-evt_05c454d946f7436198d401a2168cee73-0"},"readableId":"Q2","timeBudget":4,"questionType":"open_ended","addInstructions":"执行步骤（严格按顺序）：\n\n第一步：倾听并判断方向\n\n-   受访者回答后，判断其主要在讲正面还是负面还是混合\n    \n-   不要打断，完整听完再判断\n    \n\n第二步：顺着主要方向集中追问\n\n-   若主要讲负面 → 围绕负面方向集中追问，按属性命中顺序逐个展开\n    \n-   若主要讲正面 → 围绕正面方向集中追问，逻辑同上\n    \n-   若混合 → 先追受访者语气更强烈/篇幅更多的方向\n    \n\n第三步：确认当前方向聊透\n\n-   当前方向的属性都追问完后，主动问：「关于不满意/喜欢的地方，还有其他想补充的吗？」\n    \n-   受访者继续补充 → 继续追问\n    \n-   受访者说没有了 → 进入第四步\n    \n\n第四步：补问另一方向\n\n-   若之前主要聊了负面 → 现在补问：「那这个颜色有没有什么您觉得还不错的地方？」\n    \n-   若之前主要聊了正面 → 现在补问：「那有没有什么让您不太满意的地方？哪怕是很小的细节也可以说。」\n    \n-   另一方向同样按属性命中顺序追问，追完确认无补充后结束\n    \n-   受访者表示没有 → 确认一次，若仍没有则结束本题\n    \n\n重要：两个方向都聊完后直接结束，不回头重复已聊过的方向。\n\n参考 sectionInstruction 中的21个属性追问指引。"}],"metadata":{"clientRef":"section-s2"},"readableId":"S2","description":"Part 2：喜欢与不喜欢（补充式追问）（建议 0:30 ~ 2:30）","sectionType":"flat","sectionTitle":"S2. 喜欢与不喜欢","sectionInstruction":"环节目标：深入探索受访者对产品颜色的喜好与不满，避免重复第一印象内容。若复述可引导：「这部分您刚才提过，我们重点聊一下您还没有说到的地方。」\n\n本环节只有一个问题（Q2），AI 在这个问题内完成正反两面的探索：\n\n1.  先问一个不预设正负方向的开放性问题\n    \n2.  判断受访者倾向后，顺着其主要方向集中聊透\n    \n3.  确认聊透后，补问另一方向\n    \n4.  两面都聊完后直接进入 Q3，不回头\n    \n\n关键词匹配规则：\n\n-   受访者每次回答后立即进行语义匹配（模糊匹配，不限于精确字符串）\n    \n-   命中正面关键词→正向追问；命中负面关键词→负向追问\n    \n-   同一属性正反同时命中时，以受访者核心语义倾向为准\n    \n-   已追问过的属性再次命中时，仅在有新信息时追问，否则跳过\n    \n\n\\===== 属性追问指引 =====\n\n「刚涂抹后」类属性：\n\n1.  适合肤色 | 正⊕：颜色、色号、色调、冷暖、深浅、明度、色差→怎么看出适合？色调还是明暗度？ | 负⊖：同上→怎么看出不适合？差在哪里？\n    \n2.  自然妆效 | 正⊕：自然、妈生感、素颜、不假面、裸妆、天生好皮、看不出化妆→怎么感觉到自然的？ | 负⊖：假面、厚重、粉感重、妆感强、不自然→怎么感觉不自然？什么时候发现？\n    \n3.  水润/保湿 | 不追问\n    \n4.  质地 | 不追问\n    \n5.  白皙 | 负⊖：不够白、黑、暗、深→哪些表现觉得不够白皙？色号本身还是质地/遮盖力？\n    \n6.  不假白 | 正⊕：不假白、不死白、不惨白、白的自然→怎么判断的？ | 负⊖：假白、死白、惨白、偏白→您提到的偏白，在可接受范围内吗？还是主观上不喜欢这种白度？（以中性态度追问接受度，禁止使用「像面具」等引导性比喻词）\n    \n7.  不泛黄 | 负⊖：泛黄、发黄、偏黄、氧化→产品颜色太黄，还是底色盖不住，还是氧化？\n    \n8.  好气色 | 正⊕：气色、红润、气血、健康→具体看到了什么细节让您觉得气色变好？从颜色上看，这款粉底液起到了什么变化？（禁止问「是照镜子还是别人看到的」等封闭式选择题，必须追问具体可感知的细节和颜色变化） | 负⊖：苍白、疲惫、憔悴、没气色、气血不足→具体描述？哪些表现让人看起来没气色？\n    \n9.  肤色均匀 | 正⊕：均匀、肤色一致、匀净、不花→怎么判断的？ | 负⊖：不均、色块、一块深一块浅→什么情况下注意到的？\n    \n10.  遮瑕效果 | 正⊕：遮瑕、遮盖、遮住、零毛孔、隐形毛孔、盖住→怎么判断好？具体能遮什么？ | 负⊖：遮不住、难遮、显现毛孔→哪些瑕疵没遮住？\n     \n11.  不卡粉 | 正⊕：不卡粉、不卡纹、不积粉、不积线→哪些部位观察到的？ | 负⊖：卡粉、卡纹、积粉、卡嘴角、卡鼻翼、卡唇周、积线→具体哪些部位？\n     \n12.  不浮粉 | 正⊕：不浮粉、没粉感、融进皮肤、服帖、贴肤→什么情况下注意到的？ | 负⊖：浮粉、粉感、斑驳、不贴肤、不服帖→哪些部位？\n     \n13.  通透 | 正⊕：通透、呼吸感、薄纱、清透、薄透→怎么看出通透的？ | 负⊖：不通透、闷、不透→怎么看出不通透的？\n     \n14.  自然光泽 | 正⊕：哑光、雾面、丝绒、缎面、雾感、不油光→具体形容什么样的光泽？ | 负⊖：油光、水光、反光、油亮、太哑光→为什么觉得不好？有什么影响？\n     \n15.  提亮肤色 | 正⊕：提亮、发光、透亮、增白、明亮→从哪些表现判断的？ | 负⊖：不够提亮、不透亮→哪些表现让你觉得不够？\n     \n\n\\===== 场合追问规则 =====  \n受访者只要提到场合相关词汇（如上班、夜店、补妆、约会、聚会、逛街、通勤等），AI必须追问：「这个颜色为什么适合该场合？或者，您觉得这个颜色有没有不适合去的场合？」\n\n「一整天」持久类属性（需同时提到时间持久类表达：一整天/全天/到下午/过了几小时/出汗后/持久/持妆/到晚上）：\n\n16.  不暗沉 | 正⊕：不暗沉、没氧化→直到什么时候没暗沉？ | 负⊖：暗沉、变暗、越久越暗、氧化→什么时候注意到？程度如何？全脸还是某些部位？发现后做了什么？\n     \n17.  不泛黄 | 正⊕：不泛黄、不发黄、不偏黄→哪个时间点依然没泛黄？ | 负⊖：泛黄、发黄、偏黄、氧化、越久越黄→第几小时开始？全脸还是某些部位？\n     \n18.  不发灰 | 正⊕：不发灰、不灰、不显脏→怎么判断没发灰？ | 负⊖：发灰、灰调、灰暗、显脏、灰蒙蒙、青灰→什么时候注意到？具体描述？\n     \n19.  不卡粉/粉痕 | 正⊕：不卡粉、不卡纹、不积粉、不斑驳→哪个时间点依然没卡粉？ | 负⊖：卡粉、卡纹、积粉、斑驳→什么时候开始？哪些部位？\n     \n20.  不浮粉 | 正⊕：不浮粉、没粉感、融进皮肤→哪个时间点依然没浮粉？ | 负⊖：浮粉、粉感、斑驳→什么时候开始？哪些部位？\n     \n21.  无白色痕迹 | 正⊕：没白痕、不流白汤→今天有出汗吗？最先检查哪个部位？ | 负⊖：白痕、白汤→什么时候发现？哪些部位？"},{"id":"04091f94-1051-4412-b8f5-7c41ebfe5bca","items":[{"id":"9a6a234e-332a-4d7a-935d-4e5c7faaa6d2","text":"好的，接下来想请您对比一下。\n这个产品颜色/色号和您常用的粉底液相比，在颜色或颜色相关的方面有什么不一样？可以描述一下吗？","followUp":"timed","itemType":"question","readableId":"Q3","timeBudget":2,"questionType":"open_ended","addInstructions":"在 Q2 后进行。  \n聚焦产品颜色维度的对比。  \n若消费者只笼统说「不一样」，用开放式追问具体哪里不一样，不要提示具体维度。  \n若消费者描述了差异，用其原话追问在实际使用中的具体表现和感受。  \n始终让消费者自己描述，不要提示具体维度或引导方向。  \n禁止问购买意愿、推荐意愿等消费决策相关问题。\n\n特别追问规则：\n\n-   如果消费者提到这个产品比自己常用的产品白一点，追问一次：「白一点点大概是白多少个度？」"}],"metadata":{"clientRef":"section-s3"},"readableId":"S3","description":"Part 3：与常用粉底液的浅色号对比（建议 2:30 ~ 3:30）","sectionType":"flat","sectionTitle":"S3. 与常用粉底液的浅色号对比","sectionInstruction":"环节目标：引导受访者将本产品与常用粉底液在颜色相关方面进行对比，聚焦产品本身的表现差异。\n\n-   若只笼统说「不一样」，追问具体在产品颜色上有什么不同\n    \n-   若描述了差异，进一步追问这些差异在实际使用中的具体表现和感受\n    \n-   引导从颜色本身延伸到上脸后的使用体验和个人偏好\n    \n-   禁止追问购买意愿、推荐意愿等消费决策相关问题\n    \n-   禁止引导受访者往特定方向思考\n    \n-   若受访者回答明显无关当前问题，AI必须主动表示「没听清楚」或「想了解更具体的内容」，引导受访者重新作答，绝不允许直接跳过\n    \n\n场合追问规则：受访者只要提到场合相关词汇（如上班、夜店、补妆、约会等），AI必须追问：「这个颜色为什么适合该场合？或者，您觉得这个颜色有没有不适合去的场合？」"},{"id":"465cb0a7-fd9b-422b-80e0-b21ab05b49c7","items":[{"id":"ca7495fb-d669-4ba6-bfd3-86c6c260ab79","text":"最后一个问题。现在这个色号离您心目中理想的浅色号有多接近？您觉得哪里还不太一样？","followUp":"timed","itemType":"question","readableId":"Q4","timeBudget":2,"questionType":"open_ended","addInstructions":"访谈最后一个核心问题，在 Q3 后进行。\n\n严格禁止：\n\n-   不要让受访者打分或评分\n    \n-   不要用专业术语（明度、色调、光泽感等）引导受访者思考方向\n    \n-   不要问颜色应该怎么调/怎么改\n    \n-   不要问购买意愿\n    \n\n追问策略：\n\n-   受访者提到差距时，用其原话追问：「您刚说到XX，除了这个，还有没有其他跟颜色相关的方面，也跟理想的不太一样的？」\n    \n-   受访者认为已经完美时，可追问：「那它哪些方面跟您理想中的色号比较像？」\n    \n-   始终让消费者自己描述，不要提示具体维度\n    \n\n特别追问规则：\n\n-   如果消费者提到这个产品比理想中的产品白一点，追问一次：「白一点点大概是白多少个度？」"}],"metadata":{"clientRef":"section-s4"},"readableId":"S4","description":"Part 4：与理想中的浅色号的接近度及差距（建议 3:30 ~ 4:00）","sectionType":"flat","sectionTitle":"S4. 与理想浅色号的接近度及差距","sectionInstruction":"环节目标：评估产品色号与受访者心目中理想浅色号的接近度及差距。\n\n-   提到差距时，用受访者的原话追问，不要用专业术语（禁止使用「明度」「光泽感」「色调」等词）\n    \n-   认为已经完美时，可追问：「那它哪些方面跟您理想中的色号比较像？」\n    \n-   禁止打分/评分类提问\n    \n-   禁止追问购买意愿或购买意图\n    \n-   禁止问消费者觉得颜色应该怎么调/怎么改，消费者很难回答这类问题\n    \n-   若受访者回答明显无关当前问题，AI必须主动表示「没听清楚」或「想了解更具体的内容」，引导受访者重新作答，绝不允许直接跳过\n    \n\n场合追问规则：受访者只要提到场合相关词汇（如上班、夜店、补妆、约会等），AI必须追问：「这个颜色为什么适合该场合？或者，您觉得这个颜色有没有不适合去的场合？」"},{"id":"e286ec51-e228-4e2e-a253-6e8259fd5f74","items":[{"id":"bb4732bc-56ae-475d-98a8-6ae41a81ec5a","text":"非常感谢您的分享！关于这个产品的颜色(色号)，还有没有什么我们没聊到但您想说的？","followUp":"none","itemType":"question","readableId":"Q5","questionType":"open_ended","addInstructions":"这是访谈的最后一个问题。提问时要承接前面的对话内容，自然过渡，不要突兀地说「最后一个问题」。  \n可以用类似「今天聊了这么多您对这个色号的感受，还有没有什么我们没聊到但您想说的」的方式引入。  \n回答后不再追问，用自己的话自然感谢收尾，简要提及受访者本次分享的某个具体感受，让对方觉得被认真对待。"}],"metadata":{"clientRef":"section-s5-closing"},"readableId":"S5","description":"Part 5: 收尾","sectionType":"flat","sectionTitle":"S5. 收尾","sectionInstruction":"收尾环节。AI 需用自己的话自然收尾，禁止照搬结束消息原文。\n\n-   结束时简要回顾受访者本次访谈中提到的1-2个关键感受或亮点，让受访者感到被认真倾听\n    \n-   语气温暖自然，像朋友聊天结束一样，不要生硬地念稿\n    \n-   如受访者有补充则记录，如无则自然过渡到感谢收尾\n    \n-   若受访者回答明显无关当前问题，AI必须主动表示「没听清楚」或「想了解更具体的内容」，引导受访者重新作答，绝不允许直接跳过"}],"f10862610e2533d25d7b583b2151152f":[{"id":"S1","items":[{"id":"3bba0ae1-02d7-4473-b544-c747909b48d8","text":"您平时主要生活在哪个城市？","itemType":"question","readableId":"Q1","questionType":"open_ended","uuidBackfilledFromPublished":true},{"id":"4df74119-7cd9-4a8a-b839-adbbb825d56a","text":"您平时常用的社交平台有哪些？","itemType":"question","readableId":"Q2","questionType":"open_ended","uuidBackfilledFromPublished":true},{"id":"c80da8ac-181a-43bc-a299-e556df727b30","text":"您用过 Sora 吗？","itemType":"question","readableId":"Q3","questionType":"open_ended","uuidBackfilledFromPublished":true},{"id":"521bbf24-b64f-407e-ab32-b65dc3a6cdff","text":"您通常会在什么场景下打开 Sora？每次大概使用多久？","itemType":"question","readableId":"Q4","questionType":"open_ended","uuidBackfilledFromPublished":true},{"id":"2e426dff-67bd-41f5-b083-97afdc876baf","text":"您使用 Sora 主要是为了什么？","itemType":"question","readableId":"Q5","questionType":"open_ended","uuidBackfilledFromPublished":true},{"id":"dd20c994-7939-445d-bbd5-7ae73c041099","text":"您最喜欢 Sora 的哪些功能或体验？","itemType":"question","readableId":"Q6","questionType":"open_ended","uuidBackfilledFromPublished":true},{"id":"89804141-00e7-4606-ae6a-4ac1fe101850","text":"在使用过程中，有哪些地方让您觉得“不太好用”或“可以更好”？","itemType":"question","readableId":"Q7","questionType":"open_ended","uuidBackfilledFromPublished":true},{"id":"0ef622e2-b96d-403d-a1aa-148f15cee509","text":"自从使用 Sora 后，您在其他平台（如 Instagram、TikTok、Twitter）上的时间有没有变化？","itemType":"question","readableId":"Q8","questionType":"open_ended","uuidBackfilledFromPublished":true},{"id":"eba23a9d-fe2b-4b41-8dca-a4f53808e3d7","text":"与 Instagram、TikTok 或 Pika Labs 等相比，您觉得 Sora 最大的不同是什么？","itemType":"question","readableId":"Q9","questionType":"open_ended","uuidBackfilledFromPublished":true},{"id":"7c9892d5-333f-4d37-8dbb-67cd3fd90332","text":"您是否在 Sora 上参与过“共创”或互动？","itemType":"question","readableId":"Q10","questionType":"open_ended","uuidBackfilledFromPublished":true},{"id":"facb9e73-5607-4622-9afd-fd72b58b42d0","text":"您觉得 Sora 有成为“AI 原生社交平台”的潜力吗？","itemType":"question","readableId":"Q11","questionType":"open_ended","uuidBackfilledFromPublished":true},{"id":"f7486243-d381-4f95-b014-a5f959fdc725","text":"您会向朋友推荐 Sora 吗？为什么？","itemType":"question","readableId":"Q12","questionType":"open_ended","uuidBackfilledFromPublished":true},{"id":"955c1571-6328-48d4-9da7-a436bf76352a","text":"您觉得 Sora 的内容氛围是什么样的？","itemType":"question","readableId":"Q13","questionType":"open_ended","uuidBackfilledFromPublished":true},{"id":"e658e053-807a-44aa-9e0e-4c807ed2470e","text":"您认为 Sora 上的社交互动会如何影响人们的创作方式？","itemType":"question","readableId":"Q14","questionType":"open_ended","uuidBackfilledFromPublished":true},{"id":"8c374910-c124-44f4-93b8-ab78191f392f","text":"对您来说，Sora 最核心的价值是什么？","itemType":"question","readableId":"Q15","questionType":"open_ended","uuidBackfilledFromPublished":true}]}],"096ef9548cb8ea54b25fe2d5c7e6294e":[{"id":"13caa25c-cc58-4360-b426-739119a0fa9d","items":[{"id":"a3e8a178-f734-44e8-ac31-3499ba7b3cf9","text":"请回忆下您这两天使用这款牙膏的体验。您觉得这个口味怎么样？告诉我有哪些喜欢和不喜欢的地方呢？","followUp":"heavy","itemType":"question","metadata":{"clientRef":"stream-item-evt_09a47c195df34d4eb6e668f0d5aa0c9e-0"},"readableId":"Q1","questionType":"open_ended","addInstructions":"鼓励消费者用具体形容词来描述牙膏味道：可以用丰富的、水果味的、花香的、草本味的、薄荷味的等多种形容词。味道和口味不局限，任何口味都可以形容。\n\n需要深度展开，控制在2-3轮追问。\n\n如回答笼统（如「没什么，不清楚等」），追问：具体是哪种体验或口味让您喜欢和不喜欢呢？可以包括口味，口感，辣不辣口，容易漱口之类各个方面。"},{"id":"25003e69-a626-4f71-a74f-93b17c20f2e6","text":"请具体告诉我们，您喜欢这个口味哪些方面？口味表现好在哪里，能让您具体感受和体会到哪些好处呢？","followUp":"heavy","itemType":"question","readableId":"Q2","questionType":"open_ended","addInstructions":"鼓励消费者用具体形容词来描述喜欢的牙膏味道：可以用丰富的、水果味的、花香的、草本味的、薄荷味的等多种形容词。味道和口味不局限，任何口味都可以形容。\n\n关注喜欢的口味提及。需要深度展开，控制在2-3轮追问。\n\n如回答笼统（如「没什么，不清楚等」），追问：具体是哪种体验或口味让您喜欢呢？可以包括口味，口感，不辣口，容易漱口之类各个方面。"},{"id":"424870c4-f0a9-4969-9132-4e406f390e71","text":"那您觉得有哪些口味方面是让您感觉不喜欢的呢？请具体告诉我们哪些不好的体验和经验。然后，应该怎么样改进才能符合您的需要呢？","followUp":"heavy","itemType":"question","readableId":"Q3","questionType":"open_ended","addInstructions":"鼓励消费者用具体形容词来描述不喜欢的牙膏味道：可以用丰富的、水果味的、花香的、草本味的、薄荷味的、咸的、苦的等多种形容词。味道和口味不局限，任何口味都可以形容。\n\n关注不喜欢的口味提及。需要深度展开，控制在2-3轮追问。\n\n如回答笼统（如「没什么，不清楚等」），追问：具体是哪种体验或口味让您不喜欢呢？可以包括口味，口感，辣口，容易漱口之类各个方面。"},{"id":"215dd299-eb21-4a0f-bf8b-a97918a36a73","text":"假如您现在有机会可以对这个牙膏产品进行改进，请问您未来具体会改进这个牙膏哪些方面？比如口味，可以让牙膏变得更符合您日常刷牙习惯和需求呢？","followUp":"heavy","itemType":"question","readableId":"Q4","questionType":"open_ended","addInstructions":"问消费者未来具体希望提升或改成哪种口味，可以用丰富的、水果味的、花香的、草本味的、薄荷味的等多种形容词。味道和口味不局限，任何口味都可以形容。\n\n收集受访者对未来改进具体方面的提及。可以用生活中具体遇到过的口味。深度追问，控制在2-3轮。\n\n如回答笼统（如「没什么，不清楚等」），追问：您觉得这支牙膏哪些方面表现更好会促使您去购买呢？"}],"metadata":{"clientRef":"section-flavor"},"readableId":"S1","description":"","sectionType":"flat","sectionTitle":"口味喜欢和不喜欢方面【研究核心问题】","sectionInstruction":"本节是核心重点访谈部分 - 用于收集受访者对口味喜好的自发识别、描述和各感官维度的感知。重点探索对于口味喜欢和不喜欢的原因。保持简洁高效，每题2-3轮深度追问。"},{"id":"b5d3ee15-0e23-48f6-9c5c-6fbd1dc2ddae","items":[{"id":"308d81ab-384e-457a-ad5e-202d4c2fe15b","text":"根据过去2天使用经验，你觉得这是一款什么口味的牙膏？你觉得这款牙膏可能会具有什么功效？","followUp":"light","itemType":"question","metadata":{"clientRef":"stream-item-evt_eb3e2b28ef7d47ecaac230b3998b5273-0"},"readableId":"Q5","questionType":"open_ended","addInstructions":"鼓励消费者问出具体的牙膏口味，并请他猜有什么功效，您印象中是一款怎么样的牙膏呢？【例如：是一款新潮的、经典的、温和的、有功效的牙膏等】\n\n如提到品牌、包装等非口味因素，温和提醒仅关注牙膏口味，功效和使用感受。\n\n简短确认即可，1-2轮追问。"},{"id":"98b31421-568d-48dc-9d69-2af2498f2115","text":"假设这款产品上市了，您会购买这个口味的牙膏吗？说说原因","followUp":"light","itemType":"question","metadata":{"clientRef":"stream-item-evt_eb3e2b28ef7d47ecaac230b3998b5273-1"},"readableId":"Q6","questionType":"open_ended","addInstructions":"_先听受访者自发回答，会还是不会购买这个口味牙膏。_\n\n_收集购买和不购买的原因。可简短提示：您会购买这个口味牙膏的原因是哪些；您不会购买这个口味牙膏的原因又是什么呢？控制在1-2轮追问。_"}],"metadata":{"clientRef":"section-efficacy"},"readableId":"S2","description":"","sectionType":"flat","sectionTitle":"其它功效联想【非核心探索】","sectionInstruction":"本节非核心探索。收集牙膏口味类型和相应功效，简单追问联想背后的口味原因。控制节奏，原因追问题简单化。\n然后询问是否会购买和不会购买这个口味牙膏的原因。"}],"4cb7c37eb3e56e2b65df8a6aa8812fa1":[{"id":"050e945f-d8b3-46cd-bf12-b60ca820f161","items":[{"id":"55e9cae0-964e-4ed9-b2fb-59cddb72e2fa","text":"探寻网购决策中的信任建立与下单转化因素","followUp":"timed","itemType":"question","readableId":"Q1","timeBudget":15,"questionType":"open_ended","addInstructions":"研究目标：\n\n通过回溯消费者最近一次真实网购经历，深入理解\"信任建立与下单决策\"机制，具体聚焦三个方面：\n\n• 评价参考：用户如何看待、筛选和判断买家评价的真实性\n\n• 店铺/品牌信任判断：用户依据哪些信号判断一家店或品牌是否可信\n\n• 最终下单或放弃：是什么临门一脚促成了购买，或什么顾虑导致了放弃  \n  \n在这个主题下，必须要问到下面的题目，其余的可以考虑自由发挥\n\n1.  在这次购物中，你有没有看买家评价？主要会关注哪些内容？（比如图片、追评、差评还是问答）\n    \n2.  你怎么判断一条评价是真实的还是刷出来的？有没有什么让你觉得「这条评价可信」的具体信号？\n    \n3.  这次有没有某条评价或某类评价内容，直接影响了你的判断？是让你更放心，还是让你产生了顾虑？\n    \n4.  在那次购物中，你是怎么判断这家店铺或品牌值不值得信任的？主要看了哪些东西？（追问：是更看重店铺本身的信息，还是品牌的知名度？）\n    \n5.  有没有什么让你觉得「这家店靠谱」或者「这家店有点不放心」的具体信号？（追问：比如销量、开店时长、官方旗舰店标识，或者其他什么？）\n    \n6.  回到那次购物，你最终是下单了还是放弃了？是什么让你做出了这个决定？\n    \n7.  如果你下单了，有没有哪个具体的细节或信息让你觉得「就是现在，就买这家」？（比如限时优惠、库存提示、物流承诺等）\n    \n8.  如果你当时犹豫过或最终放弃了，是什么让你停下来？后来有没有再回去买，或者换了别家？"}],"metadata":{"clientRef":"section-intro"},"readableId":"S1","description":"","sectionType":"flat","sectionTitle":"热身：最近一次网购经历"}],"0243b178e81a77156300ad4e32078b95":[{"id":"f9a0c925-e0df-45c6-8e2f-33ea19af25b2","items":[{"id":"1367e3a3-6325-4bd1-9517-b42f06235c2d","text":"我想了解一下您平时点外卖的习惯。请分享你最典型的一次点外卖的情况。通常是怎么想到要点外卖的，怎么找到想吃的，拿到外卖之后体验怎么样？","followUp":"timed","itemType":"question","readableId":"Q1","timeBudget":3,"questionType":"open_ended","addInstructions":"先让受访者自发回顾全过程，主持人需要捕捉是否覆盖以下几个环节：\n1. 起心动念\n2. 信息搜索与比较\n3. 决策与下单\n4. 体验与反馈\n在后续的问题中需要针对这几个环节展开深入讨论，挖掘尽可能多的细节，目的是理解用户需求和判断标准，理解不同平台对需求的满足程度，是否有平台流转，重点关注美团的认知，使用驱动和障碍，以及需求满足情况"},{"id":"f4d84df7-b3ee-4b2b-a3fa-9c87d129b635","text":"【起心动念】您通常是因为什么开始想点外卖的？通常是怎么样的情况？","followUp":"timed","itemType":"question","readableId":"Q2","timeBudget":5,"questionType":"open_ended","addInstructions":"需要还原场景，理解用户点外卖的驱动因素和具体需求（功能性需求和情感性需求）"},{"id":"2e7c04fb-9014-4adc-8c26-a009736a7bfc","text":"【信息搜索与比较】决定点外卖之后，你用什么app，做了什么？每一步起到的作用是什么？","followUp":"timed","itemType":"question","readableId":"Q3","timeBudget":5,"questionType":"open_ended","addInstructions":"理解被访者的搜索和比较的逻辑"},{"id":"d5e0cd62-258f-418e-98ee-a54adb4b12e1","text":"【决策与下单】最终拍板点哪家、点什么，您通常是怎么做决定的？","followUp":"timed","itemType":"question","readableId":"Q4","timeBudget":5,"questionType":"open_ended","addInstructions":"理解被访者的决策考虑因素和影响因素，具体要求和判断方法"},{"id":"4f5563bf-dc17-44d0-a369-499b5cca42c7","text":"【体验与反馈】外卖到了之后，你的体验怎么样？","followUp":"timed","itemType":"question","readableId":"Q5","timeBudget":5,"questionType":"open_ended","addInstructions":"理解被访者的评价指标和标准"},{"id":"9e2589ed-d4e2-44f0-a714-74058344c116","text":"【门店复购】什么样的店或菜品会让您反复点？什么情况下会让您再也不想点这家？","followUp":"timed","itemType":"question","readableId":"Q6","timeBudget":5,"questionType":"open_ended","addInstructions":"理解复购驱动和障碍"},{"id":"1fbd060c-35db-43e8-aad6-457e3ddbdc13","text":"【平台复购】什么样的外卖平台会让您反复去上面点外卖？什么情况下会让您再也不想点这家？","followUp":"timed","itemType":"question","readableId":"Q7","timeBudget":5,"questionType":"open_ended","addInstructions":"理解平台复购驱动和障碍"}],"metadata":{"clientRef":"section-s1"},"readableId":"S1","description":"","sectionType":"flat","sectionTitle":"S1. 点餐决策链路回顾","sectionInstruction":"在后续的问题中需要针对以下几个环节展开深入讨论，挖掘尽可能多的细节，目的是理解用户需求和判断标准，理解不同平台对需求的满足程度，是否有平台流转，重点关注美团的认知，使用驱动和障碍，以及需求满足情况。四个环节：1. 起心动念；2. 信息搜索与比较；3. 决策与下单；4. 体验与反馈。"},{"id":"1fc6a761-1fe4-4745-be6e-55c13ecd56c3","items":[],"metadata":{"clientRef":"section-s2"},"readableId":"S2","description":"","sectionType":"flat","sectionTitle":"S2. 环节 2","sectionInstruction":"本节为环节2，具体内容待补充。"}],"f2121d2f4a778a756055ac4de98b67ba":[{"id":"57cd31bb-7850-4b49-8bdb-4272dde9c1d1","items":[{"id":"5987398a-711c-4a47-9557-47e53d336991","text":"能跟我描述一下，你一天通常是怎么吃的吗？从早到晚，工作日和周末有什么不同？","followUp":"light","itemType":"question","readableId":"Q1","questionType":"open_ended","addInstructions":"追问：那外卖/堂食/自己做饭这三种在你日常饮食里大概占多大比重？"},{"id":"d48d3c1a-95c2-4495-9749-3eeeae6b0dbe","text":"你平时在选择食物时，主要会考虑哪些因素？你平时会关注自己吃得健不健康吗？这种关注是什么时候开始的，又是什么触发了它？","followUp":"light","itemType":"question","readableId":"Q2","questionType":"open_ended","addInstructions":"追问：能举个最近的例子吗？比如上次你觉得自己吃得不健康是什么时候，当时怎么想的？"}],"readableId":"S1","description":"","sectionType":"flat","sectionTitle":"模块一：饮食习惯与健康意识"},{"id":"23ce3304-e174-4627-a135-341464e18df7","items":[{"id":"1a4d4783-af28-47f3-813b-c6196d132063","text":"你用过哪些跟健康或饮食相关的App或工具吗？当时为什么开始用？","followUp":"light","itemType":"question","readableId":"Q3","questionType":"open_ended","addInstructions":"追问触发条件1：若受访者未提及使用体验 → 追问：用下来感觉怎么样？有没有哪个时刻让你觉得「这个真的有用」？\n追问触发条件2：若受访者表示从未用过 → 追问：是什么让你没有去尝试这类工具？是不觉得需要，还是试过但觉得不值得？"},{"id":"71193bc6-2ed2-4c05-81d3-7b7b088266b1","text":"你理想中的饮食健康管理方式是什么样的？如果可以自己设计，你希望它帮你做什么？","followUp":"light","itemType":"question","readableId":"Q4","questionType":"open_ended","addInstructions":"追问触发条件：若受访者描述较抽象 → 追问：能举个具体场景吗？比如你在什么情况下最希望有人或有工具帮你管这件事？"}],"readableId":"S2","description":"","sectionType":"flat","sectionTitle":"模块二：健康管理工具使用经历"},{"id":"13bc28f4-c8a4-405e-b3a5-1cc30c8c5832","items":[{"id":"fe32cf87-e7ac-48ea-904d-e8436cdaa59a","text":"请花一两分钟看一下这个产品A的介绍，看完之后我们来聊聊你的第一感受。","media":[{"url":"[链接已隐藏]","name":"image_1780471130326.png","type":"image"}],"itemType":"statement","readableId":"T1","continueButtonText":"已阅读，继续"},{"id":"4860af01-5809-4afe-a43d-fe671dec39d2","text":"看完之后，你觉得它跟你之前用过的健康App有什么不一样？还是感觉差不多？你觉得自己是它的目标用户吗？","followUp":"light","itemType":"question","readableId":"Q5","questionType":"open_ended","addInstructions":"追问：你觉得它有没有哪个地方是你之前用过的App没有做到的？"},{"id":"6e915a9b-7276-4b36-ab5e-774f9e8320e2","text":"这7个功能里（1.自动化饮食记录、2.手动补充记录、3.连续打卡追踪、4.记录修改、5.目标设定、6.饮食分析、7.AI综合健康助手），哪个你最想用？哪个你觉得用不上？为什么？","followUp":"light","itemType":"question","readableId":"Q6","questionType":"open_ended","addInstructions":"追问：可以结合你日常的场景说说吗？是什么情况下你会用到它？"},{"id":"735d080c-8474-4906-80fc-4723ef98af0c","text":"你觉得自己会持续使用这个产品吗？为什么？","followUp":"light","itemType":"question","readableId":"Q7","questionType":"open_ended","addInstructions":"追问触发条件1：若受访者表示会持续使用 → 追问：你觉得最能让你坚持用下去的原因是什么？是某个具体功能、使用场景，还是它能逐渐变成一种习惯？\n追问触发条件2：若受访者回答较笼统，如「看情况」「不好说」 → 追问：可以回想一下你过去放弃某个App的经历，当时是在什么节点发生的？你觉得产品A可能会不会出现类似情况？"},{"id":"c10cd523-e129-4609-a421-89313683c056","text":"如果想让你更愿意长期使用这个产品，你觉得它最需要做好的是什么？","followUp":"light","itemType":"question","readableId":"Q8","questionType":"open_ended","addInstructions":"追问：能举个具体例子吗？比如什么情况下你会觉得「这个产品真的帮到我了」？"}],"readableId":"S3","description":"","sectionType":"flat","sectionTitle":"模块三：产品A功能态度"}],"7f9a495f3989c0ddb54d18da3f11331e":[{"id":"195314b6-d799-4b93-be0a-adc3bccc613c","items":[{"id":"73624de1-c316-4343-8ed5-b43e96f6bf20","text":"首先，请您完全放松、自由地告诉我，对于这个产品的颜色/色号，您第一印象或者最直接的想法是什么？不用考虑对错，想到什么就说什么","followUp":"none","itemType":"question","readableId":"Q1","questionType":"open_ended","addInstructions":"不打断，不立刻追问具体属性。  \n若消费者回答较短（如「还行」「挚好看的」），可自然追问：  \n「能再多说一点吗？这个颜色让您联想到什么？」  \n「您第一眼看到它时，心里是什么感觉？」"}],"metadata":{"clientRef":"section-s1"},"readableId":"S1","description":"Part 1: 第一印象（建议 0:00 ~ 0:30）","sectionType":"flat","sectionTitle":"S1. 第一印象","sectionInstruction":"记录受访者提到的所有关键词，作为后续追问的基础。\n\nAI访谈执行规则（全程适用）：\n\n1.  用自己的话自然发问，禁止逐字念读预设话术\n    \n2.  可合并2个以上追问方向为一个自然问题\n    \n3.  多属性命中时，按受访者提及的先后顺序追问\n    \n4.  追问时优先引用受访者原话，不用预设关键词术语，不用专业术语（禁止使用「明度」「色调」「光泽感」等词）\n    \n5.  每个属性最多追问3轮，表达简洁时深挖，主动展开时收住\n    \n6.  保持中立，不预设立场，先完整倾听再追问\n    \n7.  全程聚焦产品本身的颜色表现和使用感受，不要引导受访者往特定方向思考\n    \n8.  全程禁止打分/评分类提问\n    \n9.  全程禁止追问购买意愿、购买意图、推荐意愿等消费决策相关问题\n    \n10.  不要问消费者觉得颜色应该怎么调/怎么改\n     \n11.  若受访者回答明显无关当前问题，AI必须主动表示「没听清楚」或「想了解更具体的内容」，引导受访者重新作答，绝不允许直接跳过"},{"id":"80309b32-21c3-414b-9cf2-55af21d10421","items":[{"id":"cdaf70bb-82ab-4fae-95dd-68452be6ecc5","text":"好的，刚才您说了对它的第一印象。除了您刚才提到的那些，您还喜欢这个颜色的哪些方面？ 能具体说说您的感受吗？","followUp":"timed","itemType":"question","metadata":{"clientRef":"stream-item-evt_05c454d946f7436198d401a2168cee73-0"},"readableId":"Q2","timeBudget":4,"questionType":"open_ended","addInstructions":"执行步骤（严格按顺序）：\n\n第一步：倾听并判断方向\n\n-   受访者回答后，判断其主要在讲正面还是负面还是混合\n    \n-   不要打断，完整听完再判断\n    \n\n第二步：顺着主要方向集中追问\n\n-   若主要讲负面 → 围绕负面方向集中追问，按属性命中顺序逐个展开\n    \n-   若主要讲正面 → 围绕正面方向集中追问，逻辑同上\n    \n-   若混合 → 先追受访者语气更强烈/篇幅更多的方向\n    \n\n第三步：确认当前方向聊透\n\n-   当前方向的属性都追问完后，主动问：「关于不满意/喜欢的地方，还有其他想补充的吗？」\n    \n-   受访者继续补充 → 继续追问\n    \n-   受访者说没有了 → 进入第四步\n    \n\n第四步：补问另一方向\n\n-   若之前主要聊了负面 → 现在补问：「那这个颜色有没有什么您觉得还不错的地方？」\n    \n-   若之前主要聊了正面 → 现在补问：「那有没有什么让您不太满意的地方？哪怕是很小的细节也可以说。」\n    \n-   另一方向同样按属性命中顺序追问，追完确认无补充后结束\n    \n-   受访者表示没有 → 确认一次，若仍没有则结束本题\n    \n\n重要：两个方向都聊完后直接结束，不回头重复已聊过的方向。\n\n参考 sectionInstruction 中的21个属性追问指引。"}],"metadata":{"clientRef":"section-s2"},"readableId":"S2","description":"Part 2：喜欢与不喜欢（补充式追问）（建议 0:30 ~ 2:30）","sectionType":"flat","sectionTitle":"S2. 喜欢与不喜欢","sectionInstruction":"环节目标：深入探索受访者对产品颜色的喜好与不满，避免重复第一印象内容。若复述可引导：「这部分您刚才提过，我们重点聊一下您还没有说到的地方。」\n\n本环节只有一个问题（Q2），AI 在这个问题内完成正反两面的探索：\n\n1.  先问一个不预设正负方向的开放性问题\n    \n2.  判断受访者倾向后，顺着其主要方向集中聊透\n    \n3.  确认聊透后，补问另一方向\n    \n4.  两面都聊完后直接进入 Q3，不回头\n    \n\n关键词匹配规则：\n\n-   受访者每次回答后立即进行语义匹配（模糊匹配，不限于精确字符串）\n    \n-   命中正面关键词→正向追问；命中负面关键词→负向追问\n    \n-   同一属性正反同时命中时，以受访者核心语义倾向为准\n    \n-   已追问过的属性再次命中时，仅在有新信息时追问，否则跳过\n    \n\n\\===== 属性追问指引 =====\n\n「刚涂抹后」类属性：\n\n1.  适合肤色 | 正⊕：颜色、色号、色调、冷暖、深浅、明度、色差→怎么看出适合？色调还是明暗度？ | 负⊖：同上→怎么看出不适合？差在哪里？\n    \n2.  自然妆效 | 正⊕：自然、妈生感、素颜、不假面、裸妆、天生好皮、看不出化妆→怎么感觉到自然的？ | 负⊖：假面、厚重、粉感重、妆感强、不自然→怎么感觉不自然？什么时候发现？\n    \n3.  水润/保湿 | 不追问\n    \n4.  质地 | 不追问\n    \n5.  白皙 | 负⊖：不够白、黑、暗、深→哪些表现觉得不够白皙？色号本身还是质地/遮盖力？\n    \n6.  不假白 | 正⊕：不假白、不死白、不惨白、白的自然→怎么判断的？ | 负⊖：假白、死白、惨白、偏白→您提到的偏白，在可接受范围内吗？还是主观上不喜欢这种白度？（以中性态度追问接受度，禁止使用「像面具」等引导性比喻词）\n    \n7.  不泛黄 | 负⊖：泛黄、发黄、偏黄、氧化→产品颜色太黄，还是底色盖不住，还是氧化？\n    \n8.  好气色 | 正⊕：气色、红润、气血、健康→具体看到了什么细节让您觉得气色变好？从颜色上看，这款粉底液起到了什么变化？（禁止问「是照镜子还是别人看到的」等封闭式选择题，必须追问具体可感知的细节和颜色变化） | 负⊖：苍白、疲惫、憔悴、没气色、气血不足→具体描述？哪些表现让人看起来没气色？\n    \n9.  肤色均匀 | 正⊕：均匀、肤色一致、匀净、不花→怎么判断的？ | 负⊖：不均、色块、一块深一块浅→什么情况下注意到的？\n    \n10.  遮瑕效果 | 正⊕：遮瑕、遮盖、遮住、零毛孔、隐形毛孔、盖住→怎么判断好？具体能遮什么？ | 负⊖：遮不住、难遮、显现毛孔→哪些瑕疵没遮住？\n     \n11.  不卡粉 | 正⊕：不卡粉、不卡纹、不积粉、不积线→哪些部位观察到的？ | 负⊖：卡粉、卡纹、积粉、卡嘴角、卡鼻翼、卡唇周、积线→具体哪些部位？\n     \n12.  不浮粉 | 正⊕：不浮粉、没粉感、融进皮肤、服帖、贴肤→什么情况下注意到的？ | 负⊖：浮粉、粉感、斑驳、不贴肤、不服帖→哪些部位？\n     \n13.  通透 | 正⊕：通透、呼吸感、薄纱、清透、薄透→怎么看出通透的？ | 负⊖：不通透、闷、不透→怎么看出不通透的？\n     \n14.  自然光泽 | 正⊕：哑光、雾面、丝绒、缎面、雾感、不油光→具体形容什么样的光泽？ | 负⊖：油光、水光、反光、油亮、太哑光→为什么觉得不好？有什么影响？\n     \n15.  提亮肤色 | 正⊕：提亮、发光、透亮、增白、明亮→从哪些表现判断的？ | 负⊖：不够提亮、不透亮→哪些表现让你觉得不够？\n     \n\n\\===== 场合追问规则 =====  \n受访者只要提到场合相关词汇（如上班、夜店、补妆、约会、聚会、逛街、通勤等），AI必须追问：「这个颜色为什么适合该场合？或者，您觉得这个颜色有没有不适合去的场合？」\n\n「一整天」持久类属性（需同时提到时间持久类表达：一整天/全天/到下午/过了几小时/出汗后/持久/持妆/到晚上）：\n\n16.  不暗沉 | 正⊕：不暗沉、没氧化→直到什么时候没暗沉？ | 负⊖：暗沉、变暗、越久越暗、氧化→什么时候注意到？程度如何？全脸还是某些部位？发现后做了什么？\n     \n17.  不泛黄 | 正⊕：不泛黄、不发黄、不偏黄→哪个时间点依然没泛黄？ | 负⊖：泛黄、发黄、偏黄、氧化、越久越黄→第几小时开始？全脸还是某些部位？\n     \n18.  不发灰 | 正⊕：不发灰、不灰、不显脏→怎么判断没发灰？ | 负⊖：发灰、灰调、灰暗、显脏、灰蒙蒙、青灰→什么时候注意到？具体描述？\n     \n19.  不卡粉/粉痕 | 正⊕：不卡粉、不卡纹、不积粉、不斑驳→哪个时间点依然没卡粉？ | 负⊖：卡粉、卡纹、积粉、斑驳→什么时候开始？哪些部位？\n     \n20.  不浮粉 | 正⊕：不浮粉、没粉感、融进皮肤→哪个时间点依然没浮粉？ | 负⊖：浮粉、粉感、斑驳→什么时候开始？哪些部位？\n     \n21.  无白色痕迹 | 正⊕：没白痕、不流白汤→今天有出汗吗？最先检查哪个部位？ | 负⊖：白痕、白汤→什么时候发现？哪些部位？"},{"id":"04091f94-1051-4412-b8f5-7c41ebfe5bca","items":[{"id":"9a6a234e-332a-4d7a-935d-4e5c7faaa6d2","text":"好的，接下来想请您对比一下。\n这个产品颜色/色号和您常用的粉底液相比，在颜色或颜色相关的方面有什么不一样？可以描述一下吗？","followUp":"timed","itemType":"question","readableId":"Q3","timeBudget":2,"questionType":"open_ended","addInstructions":"在 Q2 后进行。  \n聚焦产品颜色维度的对比。  \n若消费者只笼统说「不一样」，用开放式追问具体哪里不一样，不要提示具体维度。  \n若消费者描述了差异，用其原话追问在实际使用中的具体表现和感受。  \n始终让消费者自己描述，不要提示具体维度或引导方向。  \n禁止问购买意愿、推荐意愿等消费决策相关问题。\n\n特别追问规则：\n\n-   如果消费者提到这个产品比自己常用的产品白一点，追问一次：「白一点点大概是白多少个度？」"}],"metadata":{"clientRef":"section-s3"},"readableId":"S3","description":"Part 3：与常用粉底液的浅色号对比（建议 2:30 ~ 3:30）","sectionType":"flat","sectionTitle":"S3. 与常用粉底液的浅色号对比","sectionInstruction":"环节目标：引导受访者将本产品与常用粉底液在颜色相关方面进行对比，聚焦产品本身的表现差异。\n\n-   若只笼统说「不一样」，追问具体在产品颜色上有什么不同\n    \n-   若描述了差异，进一步追问这些差异在实际使用中的具体表现和感受\n    \n-   引导从颜色本身延伸到上脸后的使用体验和个人偏好\n    \n-   禁止追问购买意愿、推荐意愿等消费决策相关问题\n    \n-   禁止引导受访者往特定方向思考\n    \n-   若受访者回答明显无关当前问题，AI必须主动表示「没听清楚」或「想了解更具体的内容」，引导受访者重新作答，绝不允许直接跳过\n    \n\n场合追问规则：受访者只要提到场合相关词汇（如上班、夜店、补妆、约会等），AI必须追问：「这个颜色为什么适合该场合？或者，您觉得这个颜色有没有不适合去的场合？」"},{"id":"465cb0a7-fd9b-422b-80e0-b21ab05b49c7","items":[{"id":"ca7495fb-d669-4ba6-bfd3-86c6c260ab79","text":"最后一个问题。现在这个色号离您心目中理想的浅色号有多接近？您觉得哪里还不太一样？","followUp":"timed","itemType":"question","readableId":"Q4","timeBudget":2,"questionType":"open_ended","addInstructions":"访谈最后一个核心问题，在 Q3 后进行。\n\n严格禁止：\n- 不要让受访者打分或评分\n- 不要用专业术语（明度、色调、光泽感等）引导受访者思考方向\n- 不要问颜色应该怎么调/怎么改\n- 不要问购买意愿\n\n追问策略：\n- 受访者提到差距时，用其原话追问：「您刚说到XX，除了这个，还有没有其他跟颜色相关的方面，也跟理想的不太一样的"}],"metadata":{"clientRef":"section-s4"},"readableId":"S4","description":"Part 4：与理想中的浅色号的接近度及差距（建议 3:30 ~ 4:00）","sectionType":"flat","sectionTitle":"S4. 与理想浅色号的接近度及差距","sectionInstruction":"环节目标：评估产品色号与受访者心目中理想浅色号的接近度及差距。\n\n-   提到差距时，用受访者的原话追问，不要用专业术语（禁止使用「明度」「光泽感」「色调」等词）\n    \n-   认为已经完美时，可追问：「那它哪些方面跟您理想中的色号比较像？」\n    \n-   禁止打分/评分类提问\n    \n-   禁止追问购买意愿或购买意图\n    \n-   禁止问消费者觉得颜色应该怎么调/怎么改，消费者很难回答这类问题\n    \n-   若受访者回答明显无关当前问题，AI必须主动表示「没听清楚」或「想了解更具体的内容」，引导受访者重新作答，绝不允许直接跳过\n    \n\n场合追问规则：受访者只要提到场合相关词汇（如上班、夜店、补妆、约会等），AI必须追问：「这个颜色为什么适合该场合？或者，您觉得这个颜色有没有不适合去的场合？」"},{"id":"e286ec51-e228-4e2e-a253-6e8259fd5f74","items":[{"id":"bb4732bc-56ae-475d-98a8-6ae41a81ec5a","text":"非常感谢您的分享！关于这个产品的颜色(色号)，还有没有什么我们没聊到但您想说的？","followUp":"none","itemType":"question","readableId":"Q5","questionType":"open_ended","addInstructions":"这是访谈的最后一个问题。提问时要承接前面的对话内容，自然过渡，不要突兀地说「最后一个问题」。\n可以用类似「今天聊了这么多您对这个色号的感受，还有没有什么我们没聊到但您想说的」的方式引入。\n回答后不再追问，用自己的话自然感谢收尾，简要提及受访者本次分享的某个具体感受，让对方觉得被认真对待。"}],"metadata":{"clientRef":"section-s5-closing"},"readableId":"S5","description":"Part 5: 收尾","sectionType":"flat","sectionTitle":"S5. 收尾","sectionInstruction":"收尾环节。AI 需用自己的话自然收尾，禁止照搬结束消息原文。\n\n-   结束时简要回顾受访者本次访谈中提到的1-2个关键感受或亮点，让受访者感到被认真倾听\n    \n-   语气温暖自然，像朋友聊天结束一样，不要生硬地念稿\n    \n-   如受访者有补充则记录，如无则自然过渡到感谢收尾\n    \n-   若受访者回答明显无关当前问题，AI必须主动表示「没听清楚」或「想了解更具体的内容」，引导受访者重新作答，绝不允许直接跳过"}],"cd365d2d2572602258faa3d13593e11b":[{"id":"S1","items":[{"id":"5920bbac-b3d3-41d3-8e1d-ec8c9fc82e49","text":"当您想到这个品牌时,脑海中最先浮现的是什么?","media":[{"url":"[链接已隐藏]","name":"mc.png","type":"image"}],"followUp":"heavy","itemType":"question","readableId":"Q1","questionType":"open_ended","addInstructions":"追问需要问的切中要害，让用户惊呼 AI 竟然能够问出这么精准且有 Insight的问题","uuidBackfilledFromPublished":true}],"readableId":"S1","description":"","sectionType":"flat","sectionTitle":"品牌认知与第一印象"},{"id":"S2","items":[{"id":"e02d0bd7-4e3e-4803-837c-7c6425ed1156","text":"在快餐品牌中,是什么促使您选择这个品牌而不是其他品牌?","media":[{"url":"[链接已隐藏]","name":"mc.png","type":"image"}],"followUp":"heavy","itemType":"question","readableId":"Q2","questionType":"open_ended","addInstructions":"追问需要问的切中要害，让用户惊呼 AI 竟然能够问出这么精准且有 Insight的问题","uuidBackfilledFromPublished":true},{"id":"aa00b68d-cdb9-4f66-a8e0-883ae9e848dd","text":"跟其他快餐品牌比起来,您觉得这个品牌哪里不一样?有什么特别的地方?","media":[{"url":"[链接已隐藏]","name":"mc.png","type":"image"}],"followUp":"light","itemType":"question","readableId":"Q3","questionType":"open_ended","addInstructions":"追问需要问的切中要害，让用户惊呼 AI 竟然能够问出这么精准且有 Insight的问题","uuidBackfilledFromPublished":true},{"id":"5b51dd00-c3b4-49b7-9ed0-40d428515181","text":"回想一下您最近一次光顾这个品牌的经历,当时您点了什么?为什么选择这些?","media":[{"url":"[链接已隐藏]","name":"mc.png","type":"image"}],"followUp":"heavy","itemType":"question","readableId":"Q4","questionType":"open_ended","addInstructions":"追问需要问的切中要害，让用户惊呼 AI 竟然能够问出这么精准且有 Insight的问题","uuidBackfilledFromPublished":true},{"id":"738ddf7d-b1d6-4030-9202-4d937e380adb","text":"您会向朋友推荐这个品牌吗?为什么会或者为什么不会?","media":[{"url":"[链接已隐藏]","name":"mc.png","type":"image"}],"followUp":"heavy","itemType":"question","readableId":"Q5","questionType":"open_ended","addInstructions":"追问需要问的切中要害，让用户惊呼 AI 竟然能够问出这么精准且有 Insight的问题","uuidBackfilledFromPublished":true}],"readableId":"S2","description":"","sectionType":"flat","sectionTitle":"品牌选择与决策因素"}],"be68d966f25882ce2c135666c94c776e":[{"id":"S1","items":[{"id":"f3010ff7-bdcf-4a3c-b7da-97ca717e80c2","text":"你平时给《原神》充值，一般用什么方式？","followUp":"light","itemType":"question","readableId":"Q1","questionType":"open_ended","addInstructions":"了解用户当前充值渠道（端内、第三方等），作为后续问题的基础","uuidBackfilledFromPublished":true},{"id":"38e05a3b-6d8c-4df6-9359-c085e3332f36","text":"回忆一下你最近一次给《原神》充值的经历，当时是在哪里充的，是什么让你选择了那个方式？","followUp":"heavy","itemType":"question","readableId":"Q2","questionType":"open_ended","addInstructions":"聚焦充值场景和选择逻辑，不需要追问具体时间。若用户提到最近一次是在网充中心充值，追问「那在那之前呢，平时习惯怎么充」，将对话引回主要充值习惯","uuidBackfilledFromPublished":true},{"id":"1c03d1ed-b440-4f7c-b075-45f2fea8322b","text":"请问你还玩别的游戏吗？如果不只是《原神》的话，给其他游戏充值时，一般习惯用什么方式充值？","followUp":"light","itemType":"question","readableId":"Q3","questionType":"open_ended","addInstructions":"问清楚是否给《原神》充值的习惯和整体给游戏充值的习惯相似，都在游戏内充值还是会在游戏外充值？为什么选择这样的充值方式。","uuidBackfilledFromPublished":true}],"readableId":"S1","description":"","sectionType":"flat","sectionTitle":"充值习惯摸底"},{"id":"S2","items":[{"id":"610e0f8f-2586-476f-815f-ed2a6865fe11","text":"你之前有去过官方网充中心，当时是什么原因让你去看了一下？","followUp":"light","itemType":"question","readableId":"Q4","questionType":"open_ended","addInstructions":"了解首次访问的动机，是广告吸引、好奇、价格等","uuidBackfilledFromPublished":true},{"id":"8d318eaf-5036-489a-8d8e-ed27b3775c85","text":"你在网充中心看了之后，还记得具体当时看到了什么？看到的内容给你什么感受吗？","followUp":"heavy","itemType":"question","readableId":"Q5","questionType":"open_ended","addInstructions":"这是核心问题，重点挖掘对方具体看到了什么、是什么感受，看对方为什么会有这种感受。是折扣不大，还是没这个习惯，还是别的原因。","uuidBackfilledFromPublished":true},{"id":"8a0f15cb-83b7-4430-b2ba-a28dced8cd40","text":"当时已经去网页访问了，怎么最后没有在HoYoverse网充中心充值呢？","followUp":"light","itemType":"question","readableId":"Q6","questionType":"open_ended","addInstructions":"这部分用户为定向捞取，都属于访问了但没使用、之后宣传材料触达后也没再次访问网充中心的用户。直接问第一次不使用网充的原因","uuidBackfilledFromPublished":true}],"readableId":"S2","description":"","sectionType":"flat","sectionTitle":"网充中心访问经历"},{"id":"S3","items":[{"id":"733ff315-3e30-4d95-98cc-d82c9cb91966","text":"那次访问官方网充中心后，你还见到过官方网充中心的宣传或广告吗？","followUp":"none","itemType":"question","readableId":"Q7","questionType":"open_ended","addInstructions":"确认对方是否留意过网充的宣传材料","uuidBackfilledFromPublished":true},{"id":"132fa891-6fcd-43c0-b724-ed3c92ac0f99","text":"后面见到的官方网充相关的宣传，给你什么感受？请帮我回忆一个具体的场景，比如当时看到了什么、感受是什么。","followUp":"none","itemType":"question","readableId":"Q8","questionType":"open_ended","addInstructions":"核心问题：挖掘二次流失原因，是宣传了进去了发现「上次没好印象」还是「觉得跟自己没关系」或「直接忽略」","uuidBackfilledFromPublished":true}],"readableId":"S3","description":"","sectionType":"flat","sectionTitle":"二次触达不回访原因"},{"id":"S4","items":[{"id":"95d3c084-7605-44c7-8821-081e33ab962d","text":"如果网充中心做出一些改变，什么情况下你会愿意再去试试？","followUp":"light","itemType":"question","readableId":"Q9","questionType":"open_ended","addInstructions":"开放式探索驱动因素，先让用户自由表达，不要预设选项。追问里看看是否是折扣力度、页面更简洁、积分体系，或纯粹是付费心智还不习惯用网充等因素。","uuidBackfilledFromPublished":true}],"readableId":"S4","description":"","sectionType":"flat","sectionTitle":"重新来访的驱动因素"}],"772387225d7cb7ee2e29f9cfd5c0b336":[{"id":"195314b6-d799-4b93-be0a-adc3bccc613c","items":[{"id":"73624de1-c316-4343-8ed5-b43e96f6bf20","text":"首先，请您完全放松、自由地告诉我，对于这个产品的颜色/色号，您第一印象或者最直接的想法是什么？不用考虑对错，想到什么就说什么","followUp":"none","itemType":"question","readableId":"Q1","questionType":"open_ended","addInstructions":"不打断，不立刻追问具体属性。\n若消费者回答较短（如「还行」「挚好看的」），可自然追问：\n「能再多说一点吗？这个颜色让您联想到什么？」\n「您第一眼看到它时，心里是什么感觉？」"}],"metadata":{"clientRef":"section-s1"},"readableId":"S1","description":"Part 1: 第一印象（建议 0:00 ~ 0:30）","sectionType":"flat","sectionTitle":"S1. 第一印象","sectionInstruction":"记录受访者提到的所有关键词，作为后续追问的基础。\n\nAI访谈执行规则（全程适用）：\n1. 用自己的话自然发问，禁止逐字念读预设话术\n2. 可合并2个以上追问方向为一个自然问题\n3. 多属性命中时，按受访者提及的先后顺序追问\n4. 追问时优先引用受访者原话，不用预设关键词术语，不用专业术语（禁止使用「明度」「色调」「光泽感」等词）\n5. 每个属性最多追问3轮，表达简洁时深挖，主动展开时收住\n6. 保持中立，不预设立场，先完整倾听再追问\n7. 全程聚焦产品本身的颜色表现和使用感受，不要引导受访者往特定方向思考\n8. 全程禁止打分/评分类提问\n9. 全程禁止追问购买意愿、购买意图、推荐意愿等消费决策相关问题\n10. 不要问消费者觉得颜色应该怎么调/怎么改\n11. 若受访者回答明显无关当前问题，AI必须主动表示「没听清楚」或「想了解更具体的内容」，引导受访者重新作答，绝不允许直接跳过"},{"id":"80309b32-21c3-414b-9cf2-55af21d10421","items":[{"id":"cdaf70bb-82ab-4fae-95dd-68452be6ecc5","text":"好的，刚才您说了对它的第一印象。除了您刚才提到的那些，您还喜欢这个颜色的哪些方面？ 能具体说说您的感受吗？","followUp":"timed","itemType":"question","metadata":{"clientRef":"stream-item-evt_05c454d946f7436198d401a2168cee73-0"},"readableId":"Q2","timeBudget":4,"questionType":"open_ended","addInstructions":"执行步骤（严格按顺序）：\n\n第一步：倾听并判断方向\n- 受访者回答后，判断其主要在讲正面还是负面还是混合\n- 不要打断，完整听完再判断\n\n第二步：顺着主要方向集中追问\n- 若主要讲负面 → 围绕负面方向集中追问，按属性命中顺序逐个展开\n- 若主要讲正面 → 围绕正面方向集中追问，逻辑同上\n- 若混合 → 先追受访者语气更强烈/篇幅更多的方向\n\n第三步：确认当前方向聊透\n- 当前方向的属性都追问完后，主动问：「关于不满意/喜欢的地方，还有其他想补充的吗？」\n- 受访者继续补充 → 继续追问\n- 受访者说没有了 → 进入第四步\n\n第四步：补问另一方向\n- 若之前主要聊了负面 → 现在补问：「那这个颜色有没有什么您觉得还不错的地方？」\n- 若之前主要聊了正面 → 现在补问：「那有没有什么让您不太满意的地方？哪怕是很小的细节也可以说。」\n- 另一方向同样按属性命中顺序追问，追完确认无补充后结束\n- 受访者表示没有 → 确认一次，若仍没有则结束本题\n\n重要：两个方向都聊完后直接结束，不回头重复已聊过的方向。\n\n参考 sectionInstruction 中的21个属性追问指引。"}],"metadata":{"clientRef":"section-s2"},"readableId":"S2","description":"Part 2：喜欢与不喜欢（补充式追问）（建议 0:30 ~ 2:30）","sectionType":"flat","sectionTitle":"S2. 喜欢与不喜欢","sectionInstruction":"环节目标：深入探索受访者对产品颜色的喜好与不满，避免重复第一印象内容。若复述可引导：「这部分您刚才提过，我们重点聊一下您还没有说到的地方。」\n\n本环节只有一个问题（Q2），AI 在这个问题内完成正反两面的探索：\n1. 先问一个不预设正负方向的开放性问题\n2. 判断受访者倾向后，顺着其主要方向集中聊透\n3. 确认聊透后，补问另一方向\n4. 两面都聊完后直接进入 Q3，不回头\n\n关键词匹配规则：\n- 受访者每次回答后立即进行语义匹配（模糊匹配，不限于精确字符串）\n- 命中正面关键词→正向追问；命中负面关键词→负向追问\n- 同一属性正反同时命中时，以受访者核心语义倾向为准\n- 已追问过的属性再次命中时，仅在有新信息时追问，否则跳过\n\n===== 属性追问指引 =====\n\n「刚涂抹后」类属性：\n\n1. 适合肤色 | 正⊕：颜色、色号、色调、冷暖、深浅、明度、色差→怎么看出适合？色调还是明暗度？ | 负⊖：同上→怎么看出不适合？差在哪里？\n2. 自然妆效 | 正⊕：自然、妈生感、素颜、不假面、裸妆、天生好皮、看不出化妆→怎么感觉到自然的？ | 负⊖：假面、厚重、粉感重、妆感强、不自然→怎么感觉不自然？什么时候发现？\n3. 水润/保湿 | 不追问\n4. 质地 | 不追问\n5. 白皙 | 负⊖：不够白、黑、暗、深→哪些表现觉得不够白皙？色号本身还是质地/遮盖力？\n6. 不假白 | 正⊕：不假白、不死白、不惨白、白的自然→怎么判断的？ | 负⊖：假白、死白、惨白、偏白→您提到的偏白，在可接受范围内吗？还是主观上不喜欢这种白度？（以中性态度追问接受度，禁止使用「像面具」等引导性比喻词）\n7. 不泛黄 | 负⊖：泛黄、发黄、偏黄、氧化→产品颜色太黄，还是底色盖不住，还是氧化？\n8. 好气色 | 正⊕：气色、红润、气血、健康→具体看到了什么细节让您觉得气色变好？从颜色上看，这款粉底液起到了什么变化？（禁止问「是照镜子还是别人看到的」等封闭式选择题，必须追问具体可感知的细节和颜色变化） | 负⊖：苍白、疲惫、憔悴、没气色、气血不足→具体描述？哪些表现让人看起来没气色？\n9. 肤色均匀 | 正⊕：均匀、肤色一致、匀净、不花→怎么判断的？ | 负⊖：不均、色块、一块深一块浅→什么情况下注意到的？\n10. 遮瑕效果 | 正⊕：遮瑕、遮盖、遮住、零毛孔、隐形毛孔、盖住→怎么判断好？具体能遮什么？ | 负⊖：遮不住、难遮、显现毛孔→哪些瑕疵没遮住？\n11. 不卡粉 | 正⊕：不卡粉、不卡纹、不积粉、不积线→哪些部位观察到的？ | 负⊖：卡粉、卡纹、积粉、卡嘴角、卡鼻翼、卡唇周、积线→具体哪些部位？\n12. 不浮粉 | 正⊕：不浮粉、没粉感、融进皮肤、服帖、贴肤→什么情况下注意到的？ | 负⊖：浮粉、粉感、斑驳、不贴肤、不服帖→哪些部位？\n13. 通透 | 正⊕：通透、呼吸感、薄纱、清透、薄透→怎么看出通透的？ | 负⊖：不通透、闷、不透→怎么看出不通透的？\n14. 自然光泽 | 正⊕：哑光、雾面、丝绒、缎面、雾感、不油光→具体形容什么样的光泽？ | 负⊖：油光、水光、反光、油亮、太哑光→为什么觉得不好？有什么影响？\n15. 提亮肤色 | 正⊕：提亮、发光、透亮、增白、明亮→从哪些表现判断的？ | 负⊖：不够提亮、不透亮→哪些表现让你觉得不够？\n\n===== 场合追问规则 =====\n受访者只要提到场合相关词汇（如上班、夜店、补妆、约会、聚会、逛街、通勤等），AI必须追问：「这个颜色为什么适合该场合？或者，您觉得这个颜色有没有不适合去的场合？」\n\n「一整天」持久类属性（需同时提到时间持久类表达：一整天/全天/到下午/过了几小时/出汗后/持久/持妆/到晚上）：\n\n16. 不暗沉 | 正⊕：不暗沉、没氧化→直到什么时候没暗沉？ | 负⊖：暗沉、变暗、越久越暗、氧化→什么时候注意到？程度如何？全脸还是某些部位？发现后做了什么？\n17. 不泛黄 | 正⊕：不泛黄、不发黄、不偏黄→哪个时间点依然没泛黄？ | 负⊖：泛黄、发黄、偏黄、氧化、越久越黄→第几小时开始？全脸还是某些部位？\n18. 不发灰 | 正⊕：不发灰、不灰、不显脏→怎么判断没发灰？ | 负⊖：发灰、灰调、灰暗、显脏、灰蒙蒙、青灰→什么时候注意到？具体描述？\n19. 不卡粉/粉痕 | 正⊕：不卡粉、不卡纹、不积粉、不斑驳→哪个时间点依然没卡粉？ | 负⊖：卡粉、卡纹、积粉、斑驳→什么时候开始？哪些部位？\n20. 不浮粉 | 正⊕：不浮粉、没粉感、融进皮肤→哪个时间点依然没浮粉？ | 负⊖：浮粉、粉感、斑驳→什么时候开始？哪些部位？\n21. 无白色痕迹 | 正⊕：没白痕、不流白汤→今天有出汗吗？最先检查哪个部位？ | 负⊖：白痕、白汤→什么时候发现？哪些部位？"},{"id":"04091f94-1051-4412-b8f5-7c41ebfe5bca","items":[{"id":"9a6a234e-332a-4d7a-935d-4e5c7faaa6d2","text":"好的，接下来想请您对比一下。\n这个产品颜色/色号和您常用的粉底液相比，在颜色或颜色相关的方面有什么不一样？可以描述一下吗？","followUp":"timed","itemType":"question","readableId":"Q3","timeBudget":2,"questionType":"open_ended","addInstructions":"在 Q2 后进行。\n聚焦产品颜色维度的对比。\n若消费者只笼统说「不一样」，用开放式追问具体哪里不一样，不要提示具体维度。\n若消费者描述了差异，用其原话追问在实际使用中的具体表现和感受。\n始终让消费者自己描述，不要提示具体维度或引导方向。\n禁止问购买意愿、推荐意愿等消费决策相关问题。\n\n特别追问规则：\n- 如果消费者提到这个产品比自己常用的产品白一点，追问一次：「白一点点大概是白多少个度？」"}],"metadata":{"clientRef":"section-s3"},"readableId":"S3","description":"Part 3：与常用粉底液的浅色号对比（建议 2:30 ~ 3:30）","sectionType":"flat","sectionTitle":"S3. 与常用粉底液的浅色号对比","sectionInstruction":"环节目标：引导受访者将本产品与常用粉底液在颜色相关方面进行对比，聚焦产品本身的表现差异。\n- 若只笼统说「不一样」，追问具体在产品颜色上有什么不同\n- 若描述了差异，进一步追问这些差异在实际使用中的具体表现和感受\n- 引导从颜色本身延伸到上脸后的使用体验和个人偏好\n- 禁止追问购买意愿、推荐意愿等消费决策相关问题\n- 禁止引导受访者往特定方向思考\n- 若受访者回答明显无关当前问题，AI必须主动表示「没听清楚」或「想了解更具体的内容」，引导受访者重新作答，绝不允许直接跳过\n\n场合追问规则：受访者只要提到场合相关词汇（如上班、夜店、补妆、约会等），AI必须追问：「这个颜色为什么适合该场合？或者，您觉得这个颜色有没有不适合去的场合？」"},{"id":"465cb0a7-fd9b-422b-80e0-b21ab05b49c7","items":[{"id":"ca7495fb-d669-4ba6-bfd3-86c6c260ab79","text":"最后一个问题。现在这个色号离您心目中理想的浅色号有多接近？您觉得哪里还不太一样？","followUp":"timed","itemType":"question","readableId":"Q4","timeBudget":2,"questionType":"open_ended","addInstructions":"访谈最后一个核心问题，在 Q3 后进行。\n\n严格禁止：\n\n-   不要让受访者打分或评分\n    \n-   不要用专业术语（明度、色调、光泽感等）引导受访者思考方向\n    \n-   不要问颜色应该怎么调/怎么改\n    \n-   不要问购买意愿\n    \n\n追问策略：\n\n-   受访者提到差距时，用其原话追问：「您刚说到XX，除了这个，还有没有其他跟颜色相关的方面，也跟理想的不太一样的？」\n    \n-   受访者认为已经完美时，可追问：「那它哪些方面跟您理想中的色号比较像？」\n    \n-   始终让消费者自己描述，不要提示具体维度\n    \n\n特别追问规则：\n\n-   如果消费者提到这个产品比理想中的产品白一点，追问一次：「白一点点大概是白多少个度？」"}],"metadata":{"clientRef":"section-s4"},"readableId":"S4","description":"Part 4：与理想中的浅色号的接近度及差距（建议 3:30 ~ 4:00）","sectionType":"flat","sectionTitle":"S4. 与理想浅色号的接近度及差距","sectionInstruction":"环节目标：评估产品色号与受访者心目中理想浅色号的接近度及差距。\n- 提到差距时，用受访者的原话追问，不要用专业术语（禁止使用「明度」「光泽感」「色调」等词）\n- 认为已经完美时，可追问：「那它哪些方面跟您理想中的色号比较像？」\n- 禁止打分/评分类提问\n- 禁止追问购买意愿或购买意图\n- 禁止问消费者觉得颜色应该怎么调/怎么改，消费者很难回答这类问题\n- 若受访者回答明显无关当前问题，AI必须主动表示「没听清楚」或「想了解更具体的内容」，引导受访者重新作答，绝不允许直接跳过\n\n场合追问规则：受访者只要提到场合相关词汇（如上班、夜店、补妆、约会等），AI必须追问：「这个颜色为什么适合该场合？或者，您觉得这个颜色有没有不适合去的场合？」"},{"id":"e286ec51-e228-4e2e-a253-6e8259fd5f74","items":[{"id":"bb4732bc-56ae-475d-98a8-6ae41a81ec5a","text":"非常感谢您的分享！关于这个产品的颜色(色号)，还有没有什么我们没聊到但您想说的？","followUp":"none","itemType":"question","readableId":"Q5","questionType":"open_ended","addInstructions":"这是访谈的最后一个问题。提问时要承接前面的对话内容，自然过渡，不要突兀地说「最后一个问题」。\n可以用类似「今天聊了这么多您对这个色号的感受，还有没有什么我们没聊到但您想说的」的方式引入。\n回答后不再追问，用自己的话自然感谢收尾，简要提及受访者本次分享的某个具体感受，让对方觉得被认真对待。"}],"metadata":{"clientRef":"section-s5-closing"},"readableId":"S5","description":"Part 5: 收尾","sectionType":"flat","sectionTitle":"S5. 收尾","sectionInstruction":"收尾环节。AI 需用自己的话自然收尾，禁止照搬结束消息原文。\n- 结束时简要回顾受访者本次访谈中提到的1-2个关键感受或亮点，让受访者感到被认真倾听\n- 语气温暖自然，像朋友聊天结束一样，不要生硬地念稿\n- 如受访者有补充则记录，如无则自然过渡到感谢收尾\n- 若受访者回答明显无关当前问题，AI必须主动表示「没听清楚」或「想了解更具体的内容」，引导受访者重新作答，绝不允许直接跳过"},{"id":"b185fcce-518a-43d8-a2b7-441dc82f029c","items":[],"readableId":"S6","description":"","sectionType":"flat","sectionTitle":"","sectionInstruction":""}],"6a44c60c0c6c7fa5f3fc720854310a76":[{"id":"S1","items":[{"id":"8c735458-8f6f-437d-bafb-19991b8bd593","text":"What kind of content are you usually making these days?","followUp":"light","itemType":"question","readableId":"Q1","questionType":"open_ended","uuidBackfilledFromPublished":true},{"id":"f2ce4731-18bc-425b-8246-1c9faefa8af1","text":"Is this something you do professionally, or more like a side project?","followUp":"light","itemType":"question","readableId":"Q2","questionType":"open_ended","uuidBackfilledFromPublished":true},{"id":"26d45cf9-6ddd-44d2-aa26-e0f33ea28328","text":"Are you mainly creating for social media, or other use cases as well?","followUp":"light","itemType":"question","readableId":"Q3","questionType":"open_ended","addInstructions":"If the user mentions social media, let them know they can type or paste their profile link directly into the text box on screen — no need to spell it out. If they find that inconvenient, just ask for their username or handle instead (e.g. 「What's your TikTok or Instagram handle?」). Either is fine.","uuidBackfilledFromPublished":true},{"id":"d052245c-70ad-4b4b-a6f5-cdf487165e27","text":"Do you use Nemo mostly for social content, or something else too?","followUp":"light","itemType":"question","readableId":"Q4","questionType":"open_ended","uuidBackfilledFromPublished":true}],"readableId":"S1","description":"","sectionType":"flat","sectionTitle":"Creator Background"},{"id":"S2","items":[{"id":"613f4f0e-1714-402b-8d68-bd2f09b2f0d0","text":"Curious — how did you come across Nemo in the first place?","followUp":"light","itemType":"question","readableId":"Q5","questionType":"open_ended","uuidBackfilledFromPublished":true},{"id":"764edfd4-2f68-415d-90c5-00dfce6af370","text":"What made you stick with it after trying it out?","followUp":"heavy","itemType":"question","readableId":"Q6","questionType":"open_ended","uuidBackfilledFromPublished":true},{"id":"899a6851-507c-40df-8894-a389b48fab53","text":"Was there a moment where you felt like \"okay, this actually works\"?","followUp":"heavy","itemType":"question","readableId":"Q7","questionType":"open_ended","uuidBackfilledFromPublished":true},{"id":"db6343c5-697b-49d8-9f3a-5cf4e2ad6755","text":"What made it feel worth paying for?","followUp":"heavy","itemType":"question","readableId":"Q8","questionType":"open_ended","uuidBackfilledFromPublished":true},{"id":"0ad7d342-2bba-472a-ad6c-32929f48 adableId":"S4","description":"","sectionType":"flat","sectionTitle":"Pain Points & Frustrations"},{"id":"S5","items":[{"id":"fab40e4c-9e09-486a-a78d-e7bdee68416b","text":"Is there anything you still have to use another tool for?","followUp":"heavy","itemType":"question","readableId":"Q17","questionType":"open_ended","uuidBackfilledFromPublished":true},{"id":"d9e1898c-1769-4e3b-af9f-319bab493512","text":"What do you wish Nemo could help you do better?","followUp":"heavy","itemType":"question","readableId":"Q18","questionType":"open_ended","uuidBackfilledFromPublished":true}],"readableId":"S5","description":"","sectionType":"flat","sectionTitle":"Editing & All-in-One Experience"},{"id":"S6","items":[{"id":"a04e2dde-a335-4979-9489-69789a092ba6","text":"If you had an AI video assistant inside your chat, what would you want it to handle for you?","followUp":"heavy","itemType":"question","readableId":"Q19","questionType":"open_ended","uuidBackfilledFromPublished":true}],"readableId":"S6","description":"","sectionType":"flat","sectionTitle":"Needs & Alternatives"}]},"sampling":{"seed":"9637ba7e54490b8c213d538776cc4563","population":2754,"cutoff":"2026-10-30","fingerprint":"62b980b26d9b7c1c285420952ae12e3b13f18206e8535cfdd84b31cc508ccbd3","projects":17}}</script>
<script>
'use strict';
const scheme=JSON.parse(document.getElementById('sample-data').textContent);
const byId=id=>document.getElementById(id),escapeHTML=v=>String(v??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
const interviews=scheme.interviews,byCase=new Map(interviews.map(e=>[e.id,e])),body=byId('body'),dialog=byId('dialog');
const done=new Set(),key=e=>'mizzen:random-interviews:'+scheme.sampling.seed+':'+e.conversation+':read';
for(const e of interviews){try{if(localStorage.getItem(key(e))==='1')done.add(e.id);}catch{}}
let filter='',ordered=interviews,selected=null,mode='transcript',readY=0,listY=0,originId='',rawMode=false;
const taskCounts=new Map();
for(const e of interviews)taskCounts.set(e.task,(taskCounts.get(e.task)||0)+1);
const tasks=[...taskCounts].sort((a,b)=>b[1]-a[1]);
byId('scope').textContent=interviews.length+' 场访谈 · '+scheme.sampling.projects+' 个研究项目 · '+tasks.length+' 类研究任务';
byId('method-text').textContent='使用截至 '+scheme.sampling.cutoff+' 的上海库历史快照。入池会话须已完成、经全文核验为定性研究、有双方发言、当场大纲和项目目标。按转录内容去重，排除此前案例册已经展示的访谈后，从 '+scheme.sampling.population.toLocaleString('zh-CN')+' 场中，以访谈为单位等概率、不放回抽取 30 场，目录保留抽取顺序。';
byId('seed').textContent='抽样种子 '+scheme.sampling.seed+'。按种子与转录指纹的 SHA-256 值排序取前 30 场。';
byId('rail').innerHTML='<div class="index-title">研究任务</div>'+[['',interviews.length],...tasks].map(([task,n])=>'<button type="button" data-task="'+escapeHTML(task)+'">'+escapeHTML(task||'全部访谈')+' <span>'+n+'</span></button>').join('');
byId('task-pick').innerHTML=[['',interviews.length],...tasks].map(([task,n])=>'<option value="'+escapeHTML(task)+'">'+escapeHTML(task||'全部访谈')+'（'+n+'）</option>').join('');
function setFilter(task){filter=task;byId('task-pick').value=task;drawList();}
byId('rail').onclick=ev=>{const b=ev.target.closest('[data-task]');if(b)setFilter(b.dataset.task);};
byId('task-pick').onchange=ev=>setFilter(ev.target.value);
byId('unread').onchange=drawList;byId('search').oninput=drawList;
function filtered(){
    const q=byId('search').value.trim().toLocaleLowerCase(),unread=byId('unread').checked;
    return interviews.filter(e=>(!filter||e.task===filter)&&(!unread||!done.has(e.id))&&(!q||[e.id,e.alias,e.title,e.task,e.domain].join(' ').toLocaleLowerCase().includes(q)));
}
const languages={zh:'中文',ja:'日语',en:'英语',pt:'葡萄牙语','zh-CN':'中文','pt-BR':'葡萄牙语'};
function lang(e){return languages[e.language]||languages[e.language.split(/[-_]/)[0]]||e.language||'语种未记录';}
function preview(e){
    const m=scheme.transcripts[e.conversation].messages.find(m=>m.role==='user'&&!m.event&&m.text.trim().length>=18);
    if(!m)return '';
    const words=Array.from(m.text.trim().replace(/\s+/g,' '));
    return '<p class="preview">受访者 · '+escapeHTML(words.slice(0,80).join(''))+(words.length>80?'…':'')+'</p>';
}
function drawList(){
    const visible=filtered();
    byId('rail').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.task===filter)));
    byId('counter').textContent='显示 '+visible.length+' / '+interviews.length+' 场　·　已读 '+done.size+' / '+interviews.length;
    byId('cards').innerHTML=visible.map(e=>'<article class="interview-card"><div class="card-head"><span class="sample-id">'+e.id+' <span class="alias">· '+escapeHTML(e.alias)+'</span></span><span class="read-state">'+(done.has(e.id)?'已读':'')+'</span></div><h3>'+escapeHTML(e.title)+'</h3><p class="card-meta">'+escapeHTML(e.task)+' · '+escapeHTML(e.domain==='未明确'?'业务场景未明确':e.domain)+'</p><p class="card-meta">'+e.records+' 条记录 · '+escapeHTML(lang(e))+' · '+escapeHTML(e.day)+'</p>'+preview(e)+'<button class="card-open" data-open="'+e.id+'">阅读完整访谈 →</button></article>').join('')||'<p class="intro-copy">当前条件下没有访谈，可调整筛选继续浏览。</p>';
}
function speaker(role){return ({assistant:'主持人',user:'受访者',system:'系统',observer:'观察员'})[role]||role;}
function displayText(message){
    const raw=message.text;
    if(message.role!=='assistant')return raw;
    const cleaned=raw.trim().replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,'');
    if(cleaned[0]==='{'){
        try{const data=JSON.parse(cleaned); if(typeof data.text==='string')return data.text;}catch{}
    }
    return raw;
}

function sourceBar(_other,extra){return extra||'';}
function bindSourceBar(){syncToolbar();}
function drawGuide(){
    mode='guide';
    const e=selected,src=scheme.transcripts[e.conversation],sections=scheme.guides[src.guideKey];
    const focus=e.guide?.id;
    const titleFor=(section,n)=>section.sectionTitle||section.title||'章节 '+(n+1);
    const count=sections.reduce((n,s)=>n+(s.items||[]).length,0);
    const raw=value=>escapeHTML(JSON.stringify(value,null,2));
    const block=(label,value)=>value?'<div class="guide-stamp">'+label+'</div><div class="source-text">'+escapeHTML(value)+'</div>':'';
    const sectionsHTML=sections.map((s,n)=>{
        const qs=s.items||[];
        const inner=qs.map((q,j)=>{
            const id=q.readableId||'条目 '+(j+1), active=Boolean(focus&&id===focus);
            const fields=[['追问设置',q.followUp],['时长设置',q.timeBudget]].filter(([,v])=>v!==undefined&&v!==null&&v!=='').map(([k,v])=>k+' '+(typeof v==='object'?JSON.stringify(v):v)).join('　');
            return '<div class="guide-item'+(active?' focus-question':'')+'"'+(active?' id="focused-question"':'')+'><span class="code">'+escapeHTML(id)+(active?' · 片段关联题':'')+'</span><h4>'+escapeHTML(q.text||q.title||'')+'</h4>'+block('主持说明',q.addInstructions)+
                (fields?'<p class="small">'+escapeHTML(fields)+'</p>':'')+(q.conditionalLogic?'<details class="json-source"><summary>条件与跳转规则</summary><pre>'+raw(q.conditionalLogic)+'</pre></details>':'')+'</div>';
        }).join('');
        return '<details class="guide-section" '+(n===0||qs.some(q=>focus&&q.readableId===focus)?'open':'')+'><summary>'+escapeHTML(titleFor(s,n))+'<small>'+qs.length+' 项</small></summary>'+block('章节描述',s.description)+block('章节说明与目的',s.sectionInstruction)+inner+'</details>';
    }).join('');
    const goal=src.goal.trim()?'<div class="source-goal" id="goal-text">'+escapeHTML(src.goal)+'</div>':'<p id="goal-text">提取时项目目标字段为空。各章节保存的目的和说明可在下方展开查看。</p>';
    const origin=src.goalSource==='published_meta.aiMetaInfo.studyGoal'?'项目发布记录':src.goalSource==='meta.aiMetaInfo.studyGoal'?'项目编辑记录':'项目字段';
    body.innerHTML=sourceBar('完整访谈',focus?'<button id="locate-question">定位 '+escapeHTML(focus)+'</button>':'')+'<h2 id="dialog-heading" class="source-heading">完整大纲与研究目标</h2><p class="small">'+escapeHTML(src.title)+' · '+escapeHTML(e.alias)+'</p><section class="context"><strong>项目研究目标 · 来源原文</strong>'+goal+'<p class="guide-stamp">'+origin+' · '+escapeHTML(src.goalSource)+' · 与会话发生时版本的一致性'+escapeHTML(src.goalHistoricalConsistency)+'</p></section>'+
        '<h3>会话当时的大纲</h3><p class="guide-stamp">'+escapeHTML(src.guideSource)+' · '+sections.length+' 章 / '+count+' 个条目</p><div class="source-tools"><button id="toggle-guide">展开全部章节</button></div>'+sectionsHTML+
        '<details class="json-source" id="raw-guide"><summary>查看完整大纲原始字段 · 脱敏 JSON</summary><pre></pre></details>';
    bindSourceBar('transcript');
    const chapters=[...body.querySelectorAll('.guide-section')],toggle=byId('toggle-guide');
    const sync=()=>{toggle.textContent=chapters.every(x=>x.open)?'收起全部章节':'展开全部章节';};
    chapters.forEach(x=>x.ontoggle=sync);
    toggle.onclick=()=>{const open=!chapters.every(x=>x.open);chapters.forEach(x=>x.open=open);sync();};sync();
    if(focus)byId('locate-question').onclick=()=>{const q=byId('focused-question');q.closest('details').open=true;q.scrollIntoView({block:'center'});};
    const json=byId('raw-guide');json.ontoggle=()=>{if(json.open&&!json.querySelector('pre').textContent)json.querySelector('pre').textContent=JSON.stringify(sections,null,2);};
    body.scrollTop=0;
}

function syncToolbar(){
    const idx=ordered.indexOf(selected);
    byId('position').textContent=selected.id+' / '+selected.alias+'　·　当前清单 '+(idx+1)+' / '+ordered.length;
    byId('prev').disabled=idx<=0;byId('next').disabled=idx<0||idx===ordered.length-1;
    byId('toggle-view').textContent=mode==='guide'?'回到原文':'大纲与目标';
    const read=done.has(selected.id);byId('mark').textContent=read?'已读 ✓':'标为已读';byId('mark').setAttribute('aria-pressed',String(read));
}
function renderMessages(){
    const src=scheme.transcripts[selected.conversation];
    byId('turns').innerHTML=src.messages.map(m=>{
        const role=m.event?'系统事件（记录角色 '+speaker(m.role)+'）':speaker(m.role);
        let text=m.text;
        if(!rawMode&&m.role==='assistant'&&!m.event)text=displayText(m).replace(/^\s*#\d+\s*[:：]\s*/,'');
        return '<div class="message turn '+escapeHTML(m.role)+(m.event?' event':'')+'" id="turn-'+escapeHTML(m.turn)+'"><small>'+escapeHTML(m.turn)+' · '+escapeHTML(role)+'</small><span>'+escapeHTML(text)+'</span></div>';
    }).join('');
}
function drawTranscript(){
    mode='transcript';
    const e=selected;
    const duration=Number.isFinite(e.duration)&&e.duration>0?' · 记录时长约 '+Math.max(1,Math.round(e.duration/60))+' 分钟':'';
    body.innerHTML='<h2 class="source-heading" id="dialog-heading">'+escapeHTML(e.title)+'</h2><p class="meta-line">'+escapeHTML(e.task)+' · '+escapeHTML(e.domain==='未明确'?'业务场景未明确':e.domain)+' · '+escapeHTML(lang(e))+' · '+escapeHTML(e.day)+duration+'</p><div class="transcript-meta"><span>完整转录 '+e.records+' 条 · 主持人 '+e.host+' 条 · 受访者 '+e.respondent+' 条</span><label><input id="raw-mode" type="checkbox" '+(rawMode?'checked':'')+'>显示原始转录字段</label></div><div id="turns"></div><p class="end-line">本场转录结束 · '+e.id+'</p>';
    renderMessages();syncToolbar();
    byId('raw-mode').onchange=ev=>{rawMode=ev.target.checked;renderMessages();};
    body.scrollTop=0;
}
function toggleView(){
    if(mode==='transcript'){readY=body.scrollTop;drawGuide();}
    else{drawTranscript();body.scrollTop=readY;}
    byId('toggle-view').focus({preventScroll:true});
}
function show(e){
    selected=e;readY=0;
    if(!dialog.open)dialog.showModal();
    drawTranscript();byId('toggle-view').focus({preventScroll:true});
}
function restoreList(){
    if(!selected)return;
    if(dialog.open)dialog.close();
    selected=null;drawList();
    const dest=byId('cards').querySelector('[data-open="'+originId+'"]')||byId('catalog-title');
    dest.focus({preventScroll:true});window.scrollTo(0,listY);
}
function route(){
    const e=byCase.get(location.hash.slice(1));
    if(!e){restoreList();return;}
    if(!dialog.open){
        listY=window.scrollY;originId=e.id;
        const vis=filtered();ordered=vis.includes(e)?vis:interviews;
    }
    if(selected!==e||!dialog.open)show(e);
}
function openCard(e){
    history.pushState({fromRandomCatalog:true},'','#'+e.id);route();
}
byId('cards').onclick=ev=>{const b=ev.target.closest('[data-open]');if(b)openCard(byCase.get(b.dataset.open));};
function step(dir){
    const next=ordered[ordered.indexOf(selected)+dir];if(!next)return;
    history.replaceState(history.state,'','#'+next.id);route();
}
function backToList(){
    if(history.state?.fromRandomCatalog){history.back();}
    else{history.replaceState(null,'','#catalog');route();}
}
byId('prev').onclick=()=>step(-1);byId('next').onclick=()=>step(1);
byId('close').onclick=backToList;byId('toggle-view').onclick=toggleView;
byId('mark').onclick=()=>{
    const e=selected,mark=!done.has(e.id);
    if(mark)done.add(e.id);else done.delete(e.id);
    try{if(mark)localStorage.setItem(key(e),'1');else localStorage.removeItem(key(e));}catch{}
    syncToolbar();
};
dialog.addEventListener('cancel',e=>{e.preventDefault();if(mode==='guide')toggleView();else backToList();});
dialog.addEventListener('keydown',e=>{
    if(e.altKey||e.metaKey||e.ctrlKey||/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName))return;
    if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();step(e.key==='ArrowRight'?1:-1);}
});
window.addEventListener('popstate',route);
window.addEventListener('hashchange',route);
drawList();route();
</script></body></html>
